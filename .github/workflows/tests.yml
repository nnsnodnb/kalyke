name: Test

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    name: Python ${{ matrix.python-version }} tests

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install required-version defined in pyproject.toml
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: 'true'

    - name: Create dummy pem file for VoIP tests
      shell: bash
      run: echo "${{ secrets.VOIP_PEM_BASE64 }}" | base64 -d > ./tests/clients/voip_certificate/dummy.pem

    - name: Run pytest
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run python -m pytest -v tests
        uv run coverage report

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7.1.1
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
