name: Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: 'true'

    - name: Setup Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.13'

    - name: Install required-version defined in pyproject.toml
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: '3.13'
        enable-cache: 'true'

    - name: Build package
      run: uv build

    - name: Upload distribution
      uses: actions/upload-artifact@v7.0.2
      with:
        name: kalyke-apns
        path: dist/

  publish:
    runs-on: ubuntu-26.04
    environment:
      name: PyPI
      url: https://pypi.org/project/kalyke-apns/

    needs:
    - build

    permissions:
      contents: write
      id-token: write

    steps:
    - name: Retrieve release distributions
      uses: actions/download-artifact@v8.0.2
      with:
        name: kalyke-apns
        path: dist/

    - name: Publish release distributions to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.3

    - name: Get the tag name
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "${GITHUB_ENV}"

    - name: Create release
      uses: softprops/action-gh-release@v3.0.3
      with:
        name: v${{ env.TAG_NAME }}
        draft: true
        generate_release_notes: true
        files: |
          dist/*
