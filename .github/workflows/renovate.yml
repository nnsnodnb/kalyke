name: Renovate

on:
  pull_request:
    paths:
      - .github/workflows/renovate.yml
      - renovate.json

jobs:
  renovate-json-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: suzuki-shunsuke/github-action-renovate-config-validator@394f7a3d2641cad2995938f9dc7e54580c8a7089  # v2.3.0
